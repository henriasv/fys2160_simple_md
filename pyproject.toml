[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fys2160-md"
version = "0.1.0"
description = "A small native molecular-dynamics solver with a notebook interface"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[project.optional-dependencies]
notebook = ["ipython>=8", "matplotlib>=3.7", "nbformat>=5", "nbclient>=0.9", "ipykernel>=6"]

[tool.setuptools.packages.find]
where = ["src"]
